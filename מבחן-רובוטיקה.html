<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>מאגר שאלות — מכטרוניקה ורובוטיקה</title>
  <meta name="description" content="אפליקציית מבחן ותרגול אינטראקטיבית" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
  <style>
/* ============================================================
   מאגר שאלות — אפליקציית מבחן ותרגול
   Light academic theme · RTL · moderate motion
   ============================================================ */

:root {
  /* palette */
  --bg: #eef3fb;
  --bg-2: #e4ecf7;
  --surface: #ffffff;
  --surface-2: #f8fafc;
  --ink: #1e293b;
  --ink-soft: #334155;
  --muted: #64748b;
  --muted-2: #94a3b8;
  --border: #e2e8f0;
  --border-strong: #cbd5e1;

  --primary: #2563eb;
  --primary-600: #1d4ed8;
  --primary-700: #1e40af;
  --primary-soft: #dbeafe;
  --accent: #0ea5e9;

  --success: #15a34a;
  --success-soft: #dcfce7;
  --danger: #dc2626;
  --danger-soft: #fee2e2;
  --warn: #d97706;
  --warn-soft: #fef3c7;
  --gold: #eab308;

  /* type scale */
  --text-xs: .78rem;
  --text-sm: .88rem;
  --text-base: 1rem;
  --text-lg: 1.15rem;
  --text-xl: 1.45rem;
  --text-2xl: 1.9rem;
  --text-3xl: 2.6rem;

  /* spacing / shape */
  --radius: 16px;
  --radius-sm: 10px;
  --radius-lg: 24px;
  --space: clamp(1rem, .6rem + 1.5vw, 1.6rem);

  --shadow-sm: 0 1px 2px rgba(15, 23, 42, .06), 0 1px 3px rgba(15, 23, 42, .05);
  --shadow: 0 4px 14px rgba(15, 23, 42, .08), 0 2px 6px rgba(15, 23, 42, .05);
  --shadow-lg: 0 18px 50px rgba(30, 64, 175, .16), 0 6px 18px rgba(15, 23, 42, .08);
  --ring: 0 0 0 4px rgba(37, 99, 235, .22);

  --dur-fast: 140ms;
  --dur: 260ms;
  --dur-slow: 460ms;
  --ease: cubic-bezier(.16, 1, .3, 1);

  --header-h: 64px;
}

* { box-sizing: border-box; }

html, body { height: 100%; }

body {
  margin: 0;
  font-family: "Heebo", "Assistant", "Segoe UI", system-ui, -apple-system, sans-serif;
  color: var(--ink);
  background:
    radial-gradient(1200px 700px at 90% -10%, #e6f0ff 0%, rgba(230,240,255,0) 60%),
    radial-gradient(900px 600px at -10% 10%, #eafaff 0%, rgba(234,250,255,0) 55%),
    linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
  background-attachment: fixed;
  font-size: var(--text-base);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

/* keep technical/code/LTR fragments tidy inside RTL text */
code, .ltr, .mono {
  font-family: "JetBrains Mono", ui-monospace, "Consolas", monospace;
  direction: ltr;
  unicode-bidi: isolate;
}
code {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: .05em .35em;
  font-size: .9em;
  color: var(--primary-700);
}

button { font-family: inherit; }

/* ---------- layout ---------- */
.app { min-height: 100%; display: flex; flex-direction: column; }

.topbar {
  position: sticky; top: 0; z-index: 30;
  height: var(--header-h);
  display: flex; align-items: center; gap: 14px;
  padding: 0 clamp(14px, 3vw, 34px);
  background: rgba(255, 255, 255, .82);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
}
.brand { display: flex; align-items: center; gap: 12px; cursor: pointer; }
.brand .logo {
  width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center;
  background: linear-gradient(140deg, var(--primary), var(--accent));
  color: #fff; box-shadow: var(--shadow); flex: none;
}
.brand .logo svg { width: 24px; height: 24px; }
.brand h1 { font-size: var(--text-lg); margin: 0; font-weight: 800; letter-spacing: -.01em; }
.brand p { margin: 0; font-size: var(--text-xs); color: var(--muted); }
.topbar .spacer { flex: 1; }

.ghost-btn {
  border: 1px solid var(--border-strong); background: var(--surface);
  color: var(--ink-soft); border-radius: 999px; padding: 8px 16px;
  font-size: var(--text-sm); font-weight: 600; cursor: pointer;
  display: inline-flex; align-items: center; gap: 7px;
  transition: transform var(--dur-fast) var(--ease), box-shadow var(--dur-fast), border-color var(--dur-fast), background var(--dur-fast);
}
.ghost-btn:hover { box-shadow: var(--shadow-sm); border-color: var(--primary); color: var(--primary-700); transform: translateY(-1px); }
.ghost-btn:active { transform: translateY(0); }

.main {
  flex: 1; width: min(1040px, 100%);
  margin: 0 auto; padding: clamp(18px, 3vw, 40px) clamp(14px, 3vw, 34px) 80px;
}

/* ---------- screen transitions ---------- */
.screen { animation: screen-in var(--dur-slow) var(--ease) both; }
@keyframes screen-in {
  from { opacity: 0; transform: translateY(14px); }
  to   { opacity: 1; transform: translateY(0); }
}

.section-title { font-size: var(--text-2xl); font-weight: 800; margin: 0 0 4px; letter-spacing: -.02em; }
.section-sub { color: var(--muted); margin: 0 0 26px; font-size: var(--text-base); }

/* ---------- hero / menu ---------- */
.hero {
  background: linear-gradient(135deg, #1e40af, #2563eb 45%, #0ea5e9);
  color: #fff; border-radius: var(--radius-lg);
  padding: clamp(22px, 4vw, 40px); margin-bottom: 26px;
  position: relative; overflow: hidden; box-shadow: var(--shadow-lg);
}
.hero::after {
  content: ""; position: absolute; inset: 0;
  background-image: radial-gradient(circle at 1px 1px, rgba(255,255,255,.16) 1px, transparent 0);
  background-size: 22px 22px; opacity: .5; pointer-events: none;
  mask-image: linear-gradient(90deg, transparent, #000 40%);
}
.hero h2 { margin: 0 0 6px; font-size: clamp(1.6rem, 1rem + 2.6vw, 2.7rem); font-weight: 800; }
.hero p { margin: 0; max-width: 60ch; color: rgba(255,255,255,.9); }
.hero .stats-row { display: flex; flex-wrap: wrap; gap: 26px; margin-top: 22px; }
.hero .stat b { display: block; font-size: var(--text-2xl); font-weight: 800; line-height: 1; }
.hero .stat span { font-size: var(--text-sm); color: rgba(255,255,255,.85); }

.menu-grid {
  display: grid; gap: 18px;
  grid-template-columns: repeat(auto-fill, minmax(248px, 1fr));
}
.tile {
  text-align: start; background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 22px; cursor: pointer;
  box-shadow: var(--shadow-sm); position: relative; overflow: hidden;
  transition: transform var(--dur) var(--ease), box-shadow var(--dur), border-color var(--dur);
  display: flex; flex-direction: column; gap: 10px; min-height: 150px;
}
.tile::before {
  content: ""; position: absolute; inset-block: 0; inset-inline-start: 0; width: 5px;
  background: linear-gradient(var(--tile-c, var(--primary)), var(--accent)); opacity: .9;
  transform: scaleY(.35); transform-origin: top; transition: transform var(--dur) var(--ease);
}
.tile:hover { transform: translateY(-5px); box-shadow: var(--shadow-lg); border-color: transparent; }
.tile:hover::before { transform: scaleY(1); }
.tile .ico {
  width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center;
  background: var(--tile-soft, var(--primary-soft)); color: var(--tile-c, var(--primary));
  transition: transform var(--dur) var(--ease);
}
.tile:hover .ico { transform: scale(1.08) rotate(-4deg); }
.tile .ico svg { width: 26px; height: 26px; }
.tile h3 { margin: 0; font-size: var(--text-lg); font-weight: 800; }
.tile p { margin: 0; color: var(--muted); font-size: var(--text-sm); }
.tile .badge {
  position: absolute; inset-inline-end: 16px; inset-block-start: 16px;
  background: var(--tile-soft, var(--primary-soft)); color: var(--tile-c, var(--primary-700));
  font-size: var(--text-xs); font-weight: 700; border-radius: 999px; padding: 3px 10px;
}

/* tile accent variants */
.t-test   { --tile-c:#2563eb; --tile-soft:#dbeafe; }
.t-prac   { --tile-c:#0ea5e9; --tile-soft:#e0f2fe; }
.t-review { --tile-c:#dc2626; --tile-soft:#fee2e2; }
.t-topic  { --tile-c:#7c3aed; --tile-soft:#ede9fe; }
.t-flash  { --tile-c:#d97706; --tile-soft:#fef3c7; }
.t-mark   { --tile-c:#eab308; --tile-soft:#fef9c3; }
.t-stats  { --tile-c:#15a34a; --tile-soft:#dcfce7; }

/* ---------- generic card / panel ---------- */
.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); box-shadow: var(--shadow); padding: clamp(18px, 3vw, 30px);
}
.panel-actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 22px; }

.btn {
  border: none; cursor: pointer; border-radius: 12px; padding: 13px 24px;
  font-size: var(--text-base); font-weight: 700; color: #fff;
  background: linear-gradient(135deg, var(--primary), var(--primary-600));
  box-shadow: 0 6px 16px rgba(37, 99, 235, .3);
  display: inline-flex; align-items: center; gap: 9px;
  transition: transform var(--dur-fast) var(--ease), box-shadow var(--dur-fast), filter var(--dur-fast);
}
.btn:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(37, 99, 235, .4); }
.btn:active { transform: translateY(0); }
.btn:disabled { opacity: .5; cursor: not-allowed; transform: none; box-shadow: none; filter: grayscale(.3); }
.btn.secondary { background: var(--surface); color: var(--primary-700); border: 1px solid var(--border-strong); box-shadow: var(--shadow-sm); }
.btn.secondary:hover { border-color: var(--primary); box-shadow: var(--shadow); }
.btn.subtle { background: var(--surface-2); color: var(--ink-soft); box-shadow: none; border: 1px solid var(--border); }
.btn.danger { background: linear-gradient(135deg, #ef4444, var(--danger)); box-shadow: 0 6px 16px rgba(220,38,38,.3); }
.btn.success { background: linear-gradient(135deg, #22c55e, var(--success)); box-shadow: 0 6px 16px rgba(21,163,74,.3); }
.btn.lg { padding: 16px 30px; font-size: var(--text-lg); }
.btn.block { width: 100%; justify-content: center; }

/* ---------- setup controls ---------- */
.field { margin-bottom: 22px; }
.field > label { display: block; font-weight: 700; margin-bottom: 10px; }
.field .hint { color: var(--muted); font-size: var(--text-sm); font-weight: 400; }

.seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px; padding: 4px; gap: 4px; flex-wrap: wrap; }
.seg button {
  border: none; background: transparent; color: var(--muted); cursor: pointer;
  padding: 9px 18px; border-radius: 9px; font-weight: 700; font-size: var(--text-sm);
  transition: background var(--dur-fast), color var(--dur-fast), box-shadow var(--dur-fast);
}
.seg button.active { background: var(--surface); color: var(--primary-700); box-shadow: var(--shadow-sm); }

.stepper { display: inline-flex; align-items: center; gap: 14px; }
.stepper button {
  width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--border-strong);
  background: var(--surface); font-size: 1.3rem; font-weight: 700; cursor: pointer; color: var(--primary-700);
  transition: transform var(--dur-fast), border-color var(--dur-fast);
}
.stepper button:hover { border-color: var(--primary); transform: translateY(-1px); }
.stepper .val { font-size: var(--text-2xl); font-weight: 800; min-width: 70px; text-align: center; }
.stepper .val small { font-size: var(--text-sm); color: var(--muted); font-weight: 600; }

/* ---------- quiz runner ---------- */
.runner-top {
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  margin-bottom: 18px;
}
.qcount { font-weight: 800; font-size: var(--text-lg); }
.qcount small { color: var(--muted); font-weight: 600; }
.topic-chip {
  background: var(--primary-soft); color: var(--primary-700); border-radius: 999px;
  padding: 5px 14px; font-size: var(--text-sm); font-weight: 700;
}
.runner-top .spacer { flex: 1; }
.timer {
  display: inline-flex; align-items: center; gap: 8px; font-weight: 800;
  font-variant-numeric: tabular-nums; background: var(--surface); border: 1px solid var(--border-strong);
  border-radius: 999px; padding: 8px 16px; font-size: var(--text-lg); box-shadow: var(--shadow-sm);
}
.timer.low { color: var(--danger); border-color: var(--danger); animation: pulse 1s infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 6px rgba(220,38,38,.15); } }

.progress { height: 8px; border-radius: 999px; background: var(--border); overflow: hidden; margin-bottom: 24px; }
.progress > i { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--primary), var(--accent)); transition: width var(--dur-slow) var(--ease); }

.question-text {
  font-size: var(--text-xl); font-weight: 700; line-height: 1.5; margin: 0 0 22px;
}
.options { display: grid; gap: 12px; }
.option {
  display: flex; align-items: flex-start; gap: 14px; text-align: start;
  background: var(--surface); border: 2px solid var(--border); border-radius: 14px;
  padding: 16px 18px; cursor: pointer; font-size: var(--text-base); color: var(--ink-soft);
  transition: transform var(--dur-fast) var(--ease), border-color var(--dur-fast), background var(--dur-fast), box-shadow var(--dur-fast);
  width: 100%;
}
.option:hover:not(.locked) { border-color: var(--primary); background: #f5f9ff; transform: translateX(-3px); }
.option .key {
  flex: none; width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center;
  background: var(--surface-2); border: 1px solid var(--border); font-weight: 800; font-size: var(--text-sm);
  color: var(--muted); direction: ltr;
}
.option .txt { flex: 1; padding-top: 2px; }
.option.selected { border-color: var(--primary); background: var(--primary-soft); box-shadow: var(--ring); }
.option.selected .key { background: var(--primary); color: #fff; border-color: var(--primary); }
.option.correct { border-color: var(--success); background: var(--success-soft); }
.option.correct .key { background: var(--success); color: #fff; border-color: var(--success); }
.option.wrong { border-color: var(--danger); background: var(--danger-soft); }
.option.wrong .key { background: var(--danger); color: #fff; border-color: var(--danger); }
.option.locked { cursor: default; }
.option .mark { margin-inline-start: auto; font-weight: 800; align-self: center; }

.explain {
  margin-top: 18px; border-radius: 14px; padding: 16px 18px; font-size: var(--text-sm);
  background: var(--surface-2); border: 1px solid var(--border); border-inline-start: 4px solid var(--primary);
  animation: screen-in var(--dur) var(--ease) both;
}
.explain b { color: var(--primary-700); }
.explain.ok { border-inline-start-color: var(--success); }
.explain.no { border-inline-start-color: var(--danger); }

.runner-nav { display: flex; gap: 12px; align-items: center; margin-top: 26px; flex-wrap: wrap; }
.runner-nav .spacer { flex: 1; }

.flag-btn {
  border: 1px solid var(--border-strong); background: var(--surface); color: var(--muted);
  border-radius: 10px; padding: 10px 14px; cursor: pointer; font-weight: 600; font-size: var(--text-sm);
  display: inline-flex; gap: 7px; align-items: center; transition: all var(--dur-fast);
}
.flag-btn.on { color: var(--gold); border-color: var(--gold); background: var(--warn-soft); }
.flag-btn:hover { transform: translateY(-1px); }

/* question palette */
.palette { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 26px; }
.palette button {
  width: 38px; height: 38px; border-radius: 9px; border: 1px solid var(--border);
  background: var(--surface); font-weight: 700; cursor: pointer; color: var(--muted);
  font-variant-numeric: tabular-nums; transition: all var(--dur-fast);
}
.palette button:hover { border-color: var(--primary); transform: translateY(-2px); }
.palette button.answered { background: var(--primary-soft); color: var(--primary-700); border-color: var(--primary-soft); }
.palette button.flagged { box-shadow: inset 0 -4px 0 var(--gold); }
.palette button.current { outline: 2px solid var(--primary); outline-offset: 1px; }

/* ---------- results ---------- */
.score-hero { display: flex; gap: 28px; align-items: center; flex-wrap: wrap; }
.dial { --p: 0; width: 168px; height: 168px; flex: none; position: relative; display: grid; place-items: center; }
.dial svg { transform: rotate(-90deg); width: 100%; height: 100%; }
.dial .track { fill: none; stroke: var(--border); stroke-width: 14; }
.dial .bar { fill: none; stroke: url(#grad); stroke-width: 14; stroke-linecap: round; transition: stroke-dashoffset 1.1s var(--ease); }
.dial .num { position: absolute; text-align: center; }
.dial .num b { font-size: 2.4rem; font-weight: 800; line-height: 1; }
.dial .num span { font-size: var(--text-sm); color: var(--muted); }
.verdict h2 { margin: 0 0 4px; font-size: var(--text-2xl); }
.verdict .tag { display: inline-block; font-weight: 800; border-radius: 999px; padding: 5px 16px; font-size: var(--text-base); }
.tag.pass { background: var(--success-soft); color: var(--success); }
.tag.fail { background: var(--danger-soft); color: var(--danger); }
.verdict p { color: var(--muted); margin: 10px 0 0; }

.result-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 14px; margin: 26px 0; }
.rstat { background: var(--surface-2); border: 1px solid var(--border); border-radius: 14px; padding: 16px; text-align: center; }
.rstat b { display: block; font-size: var(--text-2xl); font-weight: 800; }
.rstat.ok b { color: var(--success); }
.rstat.no b { color: var(--danger); }
.rstat span { font-size: var(--text-sm); color: var(--muted); }

.topic-break { display: grid; gap: 10px; margin-top: 8px; }
.tb-row { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; }
.tb-row .label { font-weight: 600; font-size: var(--text-sm); }
.tb-bar { grid-column: 1 / -1; height: 8px; border-radius: 999px; background: var(--border); overflow: hidden; }
.tb-bar > i { display: block; height: 100%; border-radius: 999px; transition: width 1s var(--ease); }
.tb-row .pct { font-variant-numeric: tabular-nums; font-weight: 700; font-size: var(--text-sm); }
.weak-flag { color: var(--danger); font-size: var(--text-xs); font-weight: 700; }

.review-list { display: grid; gap: 14px; margin-top: 8px; }
.rev-item { border: 1px solid var(--border); border-radius: 14px; padding: 16px 18px; background: var(--surface); }
.rev-item.ok { border-inline-start: 4px solid var(--success); }
.rev-item.no { border-inline-start: 4px solid var(--danger); }
.rev-item .q { font-weight: 700; margin: 0 0 10px; }
.rev-line { font-size: var(--text-sm); margin: 3px 0; }
.rev-line .lab { color: var(--muted); font-weight: 600; }
.rev-line.good { color: var(--success); }
.rev-line.bad { color: var(--danger); }

/* ---------- flashcards ---------- */
.flash-wrap { display: grid; place-items: center; gap: 22px; }
.flashcard { width: min(620px, 100%); min-height: 320px; perspective: 1600px; cursor: pointer; }
.flash-inner { position: relative; width: 100%; height: 100%; min-height: 320px; transition: transform var(--dur-slow) var(--ease); transform-style: preserve-3d; }
.flashcard.flipped .flash-inner { transform: rotateY(180deg); }
.flash-face {
  position: absolute; inset: 0; backface-visibility: hidden; border-radius: var(--radius-lg);
  padding: 32px; display: flex; flex-direction: column; justify-content: center; gap: 16px;
  background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow-lg);
}
.flash-face .pill { align-self: flex-start; font-size: var(--text-xs); font-weight: 800; border-radius: 999px; padding: 4px 12px; }
.flash-front .pill { background: var(--primary-soft); color: var(--primary-700); }
.flash-front .q { font-size: var(--text-xl); font-weight: 700; line-height: 1.5; }
.flash-front .tap { color: var(--muted-2); font-size: var(--text-sm); margin-top: auto; }
.flash-back { transform: rotateY(180deg); background: linear-gradient(160deg, #f0f9ff, #fff); }
.flash-back .pill { background: var(--success-soft); color: var(--success); }
.flash-back .ans { font-size: var(--text-lg); font-weight: 800; color: var(--success); }
.flash-back .exp { font-size: var(--text-sm); color: var(--ink-soft); }
.flash-controls { display: flex; align-items: center; gap: 14px; }

/* ---------- topic / list grids ---------- */
.list-grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
.topic-card {
  text-align: start; background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
  padding: 18px; cursor: pointer; box-shadow: var(--shadow-sm);
  transition: transform var(--dur) var(--ease), box-shadow var(--dur), border-color var(--dur);
  display: flex; flex-direction: column; gap: 6px;
}
.topic-card:hover { transform: translateY(-4px); box-shadow: var(--shadow); border-color: var(--primary); }
.topic-card .name { font-weight: 800; font-size: var(--text-lg); }
.topic-card .meta { color: var(--muted); font-size: var(--text-sm); }
.topic-card .acc { font-size: var(--text-sm); font-weight: 700; }

/* ---------- bookmarks / stats ---------- */
.bk-item { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); margin-bottom: 10px; }
.bk-item .q { font-weight: 600; flex: 1; }
.bk-item .star { color: var(--gold); flex: none; }

.stat-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; margin-bottom: 26px; }
.stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 20px; box-shadow: var(--shadow-sm); }
.stat-card b { display: block; font-size: var(--text-3xl); font-weight: 800; line-height: 1; color: var(--primary-700); }
.stat-card span { color: var(--muted); font-size: var(--text-sm); }

.history { display: grid; gap: 8px; }
.hist-row { display: grid; grid-template-columns: auto 1fr auto auto; gap: 14px; align-items: center; padding: 12px 16px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); font-size: var(--text-sm); }
.hist-row .dot { width: 12px; height: 12px; border-radius: 50%; }
.hist-row .dot.pass { background: var(--success); } .hist-row .dot.fail { background: var(--danger); }
.hist-row .sc { font-weight: 800; font-variant-numeric: tabular-nums; }

/* ---------- misc ---------- */
.empty { text-align: center; color: var(--muted); padding: 50px 20px; }
.empty .big { font-size: 3rem; margin-bottom: 8px; }
.icon-btn { background: none; border: none; cursor: pointer; color: var(--muted); padding: 6px; border-radius: 8px; display: inline-grid; place-items: center; transition: color var(--dur-fast), background var(--dur-fast); }
.icon-btn:hover { color: var(--gold); background: var(--warn-soft); }
.icon-btn.on { color: var(--gold); }
.icon-btn svg { width: 22px; height: 22px; }

.toast {
  position: fixed; inset-block-end: 24px; inset-inline-start: 50%; transform: translateX(50%) translateY(120%);
  background: var(--ink); color: #fff; padding: 12px 22px; border-radius: 999px; font-weight: 600;
  box-shadow: var(--shadow-lg); z-index: 80; transition: transform var(--dur) var(--ease); font-size: var(--text-sm);
}
.toast.show { transform: translateX(50%) translateY(0); }

.confetti-piece { position: fixed; width: 10px; height: 14px; top: -20px; z-index: 90; pointer-events: none; border-radius: 2px; }

/* responsive */
@media (max-width: 560px) {
  .hero .stats-row { gap: 16px; }
  .runner-top { gap: 10px; }
  .btn { padding: 12px 18px; }
  .dial { width: 140px; height: 140px; }
}

/* accessibility: respect reduced motion */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
  .flash-inner { transition: none; }
}

.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

  /* ---------- utils ---------- */
  function shuffle(arr) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
  function sampleN(arr, n) { return shuffle(arr).slice(0, Math.min(n, arr.length)); }
  function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
  function fmtTime(sec) { sec = Math.max(0, Math.round(sec)); const m = Math.floor(sec / 60), s = sec % 60; return `${m}:${String(s).padStart(2, "0")}`; }
  function fmtDate(ts) { const d = new Date(ts); return d.toLocaleDateString("he-IL", { day: "2-digit", month: "2-digit" }) + " " + d.toLocaleTimeString("he-IL", { hour: "2-digit", minute: "2-digit" }); }

  let toastTimer;
  function toast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg; t.classList.add("show");
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2200);
  }

  const view = document.getElementById("view");
  let activeTimer = null; // teardown handle for runner timer
  function clearActiveTimer() { if (activeTimer) { clearInterval(activeTimer); activeTimer = null; } }
  function setView(html) { clearActiveTimer(); view.innerHTML = html; view.scrollTo?.(0, 0); window.scrollTo(0, 0); }

  /* ============================================================
     MENU
     ============================================================ */
  function renderMenu() {
    const st = getStats();
    const accuracy = st.answered ? Math.round((st.correctTotal / st.answered) * 100) : 0;
    const best = st.attempts.filter(a => a.mode === "exam").reduce((m, a) => Math.max(m, a.pct), 0);
    const mistakes = getMistakes().size;
    const bookmarks = getBookmarks().size;

    const tiles = [
      { k: "test", cls: "t-test", t: "מבחן מדומה", d: `${TEST_COUNT} שאלות אקראיות עם טיימר וציון — בדיוק כמו המבחן האמיתי.`, badge: `${TEST_COUNT} שאלות`, go: renderTestSetup },
      { k: "prac", cls: "t-prac", t: "תרגול חופשי", d: "כל השאלות, משוב מיידי והסבר אחרי כל תשובה.", badge: `${QUESTIONS.length}`, go: () => startPractice(shuffle(QUESTIONS), "תרגול חופשי") },
      { k: "review", cls: "t-review", t: "חזרה על טעויות", d: "תרגול ממוקד של שאלות שטעית בהן בעבר.", badge: mistakes ? `${mistakes}` : "0", go: startReview },
      { k: "topic", cls: "t-topic", t: "לימוד לפי נושא", d: "בחר נושא ותרגל רק אותו — חיישנים, בקרה, Arduino ועוד.", badge: `${TOPICS.length} נושאים`, go: renderTopics },
      { k: "flash", cls: "t-flash", t: "כרטיסיות", d: "שאלה בצד אחד, התשובה הנכונה וההסבר בצד השני.", badge: "Flip", go: () => startFlashcards(shuffle(QUESTIONS), "כל השאלות") },
      { k: "mark", cls: "t-mark", t: "שאלות מסומנות", d: "השאלות שסימנת בכוכב לחזרה מהירה.", badge: bookmarks ? `${bookmarks}` : "0", go: renderBookmarks },
      { k: "stats", cls: "t-stats", t: "התקדמות וסטטיסטיקה", d: "ציונים, דיוק לפי נושא והיסטוריית מבחנים.", badge: "", go: renderStats },
    ];

    setView(`
      <section class="screen">
        <div class="hero">
          <h2>בהצלחה במבחן! 🚀</h2>
          <p>תרגול אינטראקטיבי על כל מאגר השאלות במכטרוניקה ורובוטיקה. בחר מצב כדי להתחיל.</p>
          <div class="stats-row">
            <div class="stat"><b>${QUESTIONS.length}</b><span>שאלות במאגר</span></div>
            <div class="stat"><b>${st.answered}</b><span>תשובות שענית</span></div>
            <div class="stat"><b>${accuracy}%</b><span>דיוק כולל</span></div>
            <div class="stat"><b>${best ? best + "%" : "—"}</b><span>הציון הטוב ביותר</span></div>
          </div>
        </div>
        <div class="menu-grid">
          ${tiles.map((t, i) => `
            <button class="tile ${t.cls}" data-i="${i}">
              ${t.badge ? `<span class="badge">${t.badge}</span>` : ""}
              <span class="ico">${ICON[t.k]}</span>
              <h3>${t.t}</h3>
              <p>${t.d}</p>
            </button>`).join("")}
        </div>
      </section>
    `);
    view.querySelectorAll(".tile").forEach(el => el.addEventListener("click", () => tiles[+el.dataset.i].go()));
  }

  /* ============================================================
     TEST SETUP
     ============================================================ */
  let setupMinutes = DEFAULT_MINUTES;
  let setupTimerOn = true;
  function renderTestSetup() {
    setView(`
      <section class="screen">
        <h2 class="section-title">מבחן מדומה</h2>
        <p class="section-sub">${TEST_COUNT} שאלות אקראיות מתוך ${QUESTIONS.length}. אי-אפשר לראות תשובות עד הסיום — בדיוק כמו במבחן.</p>
        <div class="card">
          <div class="field">
            <label>טיימר</label>
            <div class="seg" id="timerSeg">
              <button data-on="1" class="${setupTimerOn ? "active" : ""}">עם טיימר ספירה לאחור</button>
              <button data-on="0" class="${setupTimerOn ? "" : "active"}">בלי טיימר</button>
            </div>
          </div>
          <div class="field" id="minField" style="${setupTimerOn ? "" : "display:none"}">
            <label>משך המבחן <span class="hint">(דקות)</span></label>
            <div class="stepper">
              <button id="mMinus">−</button>
              <span class="val"><span id="mVal">${setupMinutes}</span> <small>דק'</small></span>
              <button id="mPlus">+</button>
            </div>
          </div>
          <div class="panel-actions">
            <button class="btn lg" id="startTestBtn">
              ${ICON.test} התחל מבחן
            </button>
            <button class="btn secondary" id="backBtn">חזרה</button>
          </div>
        </div>
        <p class="section-sub" style="margin-top:18px">ציון עובר: <b>${PASS_MARK}%</b>. בסיום תקבל ציון, פילוח לפי נושא וסקירת כל השאלות עם הסברים.</p>
      </section>
    `);
    const minField = view.querySelector("#minField");
    view.querySelectorAll("#timerSeg button").forEach(b => b.addEventListener("click", () => {
      setupTimerOn = b.dataset.on === "1";
      view.querySelectorAll("#timerSeg button").forEach(x => x.classList.toggle("active", x === b));
      minField.style.display = setupTimerOn ? "" : "none";
    }));
    view.querySelector("#mMinus").addEventListener("click", () => { setupMinutes = Math.max(5, setupMinutes - 5); view.querySelector("#mVal").textContent = setupMinutes; });
    view.querySelector("#mPlus").addEventListener("click", () => { setupMinutes = Math.min(180, setupMinutes + 5); view.querySelector("#mVal").textContent = setupMinutes; });
    view.querySelector("#startTestBtn").addEventListener("click", () => {
      const qs = sampleN(QUESTIONS, TEST_COUNT);
      runQuiz({ questions: qs, mode: "exam", title: "מבחן מדומה", timerSec: setupTimerOn ? setupMinutes * 60 : 0 });
    });
    view.querySelector("#backBtn").addEventListener("click", renderMenu);

  /* ============================================================
     QUIZ ENGINE  (exam + practice share one runner)
     mode: "exam"  -> no feedback until submit, timer, palette
     mode: "practice" -> immediate feedback + explanation
     ============================================================ */
  function startPractice(qs, title) {
    if (!qs.length) { toast("אין שאלות להצגה"); return; }
    runQuiz({ questions: qs, mode: "practice", title });
  }
  function startReview() {
    const ids = [...getMistakes()];
    const qs = ids.map(id => byId.get(id)).filter(Boolean);
    if (!qs.length) { renderEmpty("אין טעויות לחזרה 🎉", "כל הכבוד! ענית נכון על כל מה שתרגלת עד כה. צבור טעויות במצב תרגול או מבחן והן יופיעו כאן.", renderMenu); return; }
    runQuiz({ questions: shuffle(qs), mode: "practice", title: "חזרה על טעויות", review: true });
  }

  function runQuiz(cfg) {
    const { questions, mode, title } = cfg;
    const isExam = mode === "exam";
    const state = {
      i: 0,
      answers: new Array(questions.length).fill(null),
      flags: new Array(questions.length).fill(false),
      revealed: new Array(questions.length).fill(false),
      startedAt: Date.now(),
      remaining: cfg.timerSec || 0,
    };

    function shell() {
      setView(`
        <section class="screen" id="runner">
          <div class="runner-top">
            <span class="qcount"><span id="qNum">1</span> <small>/ ${questions.length}</small></span>
            <span class="topic-chip" id="topicChip"></span>
            <div class="spacer"></div>
            <button class="icon-btn" id="bmBtn" title="סמן שאלה (כוכב)"></button>
            ${isExam && cfg.timerSec ? `<span class="timer" id="timer">${ICON.clock}<span id="tVal">${fmtTime(state.remaining)}</span></span>` : ""}
            <button class="ghost-btn" id="quitBtn">יציאה</button>
          </div>
          <div class="progress"><i id="bar"></i></div>
          <div class="card" id="qCard"></div>
          <div class="runner-nav" id="nav"></div>
          ${isExam ? `<div class="palette" id="palette"></div>` : ""}
        </section>
      `);
      if (isExam && cfg.timerSec) startTimer();
      view.querySelector("#quitBtn").addEventListener("click", () => {
        if (confirm(isExam ? "לצאת מהמבחן? ההתקדמות לא תישמר." : "לצאת מהתרגול?")) renderMenu();
      });
      view.querySelector("#bmBtn").addEventListener("click", toggleBookmark);
      renderQ();
    }

    function startTimer() {
      activeTimer = setInterval(() => {
        state.remaining--;
        const t = view.querySelector("#tVal"); const box = view.querySelector("#timer");
        if (t) t.textContent = fmtTime(state.remaining);
        if (box) box.classList.toggle("low", state.remaining <= 60);
        if (state.remaining <= 0) { clearActiveTimer(); toast("הזמן נגמר — מסכם מבחן"); finish(); }
      }, 1000);
    }

    function toggleBookmark() {
      const q = questions[state.i]; const bm = getBookmarks();
      if (bm.has(q.id)) { bm.delete(q.id); toast("הוסר מהמסומנים"); } else { bm.add(q.id); toast("נוסף למסומנים ⭐"); }
      saveSet(LS.bookmarks, bm); paintBookmark();
    }
    function paintBookmark() {
      const q = questions[state.i]; const on = getBookmarks().has(q.id);
      const b = view.querySelector("#bmBtn"); b.classList.toggle("on", on); b.innerHTML = on ? ICON.starFull : ICON.starOut;
    }

    function renderQ() {
      const q = questions[state.i];
      const letters = Object.keys(q.options);
      const chosen = state.answers[state.i];
      const revealed = state.revealed[state.i];

      view.querySelector("#qNum").textContent = state.i + 1;
      view.querySelector("#topicChip").textContent = q.topic;
      view.querySelector("#bar").style.width = ((state.i + (revealed || chosen ? 1 : 0)) / questions.length * 100) + "%";
      paintBookmark();

      const optsHtml = letters.map(L => {
        let cls = "option";
        if (isExam) { if (chosen === L) cls += " selected"; }
        else if (revealed) {
          cls += " locked";
          if (L === q.correct) cls += " correct";
          else if (L === chosen) cls += " wrong";
        } else if (chosen === L) cls += " selected";
        const mark = (!isExam && revealed) ? (L === q.correct ? '<span class="mark" style="color:var(--success)">✓</span>' : (L === chosen ? '<span class="mark" style="color:var(--danger)">✗</span>' : "")) : "";
        return `<button class="${cls}" data-l="${esc(L)}"><span class="key">${esc(L)}</span><span class="txt">${esc(q.options[L])}</span>${mark}</button>`;
      }).join("");

      let explainHtml = "";
      if (!isExam && revealed) {
        const ok = chosen === q.correct;
        explainHtml = `<div class="explain ${ok ? "ok" : "no"}">
          <b>${ok ? "נכון! ✓" : "טעות ✗"}</b> — התשובה הנכונה: <b>${esc(q.correct)}</b>. ${esc(q.options[q.correct])}
          ${q.explanation ? `<div style="margin-top:8px">${esc(q.explanation)}</div>` : ""}
        </div>`;
      }

      view.querySelector("#qCard").innerHTML = `
        <p class="question-text">${esc(q.question)}</p>
        <div class="options">${optsHtml}</div>
        ${explainHtml}
      `;

      view.querySelectorAll(".option").forEach(el => el.addEventListener("click", () => choose(el.dataset.l)));
      renderNav();
      if (isExam) renderPalette();
    }

    function choose(L) {
      const q = questions[state.i];
      if (isExam) {
        state.answers[state.i] = L;
        view.querySelectorAll(".option").forEach(el => el.classList.toggle("selected", el.dataset.l === L));
      } else {
        if (state.revealed[state.i]) return;       // already answered
        state.answers[state.i] = L;
        state.revealed[state.i] = true;
        // live stats + mistakes/review bookkeeping
        recordAnswer(q, L === q.correct);
        if (cfg.review && L === q.correct) { const m = getMistakes(); m.delete(q.id); saveSet(LS.mistakes, m); }
        renderQ();
      }
    }

    function renderNav() {
      const nav = view.querySelector("#nav");
      const last = state.i === questions.length - 1;
      if (isExam) {
        const answered = state.answers.filter(Boolean).length;
        nav.innerHTML = `
          <button class="flag-btn ${state.flags[state.i] ? "on" : ""}" id="flagBtn">${ICON.flag} ${state.flags[state.i] ? "מסומן לבדיקה" : "סמן לבדיקה"}</button>
          <div class="spacer"></div>
          <button class="btn secondary" id="prevBtn" ${state.i === 0 ? "disabled" : ""}>הקודם</button>
          <button class="btn" id="nextBtn" ${last ? "disabled" : ""}>הבא</button>
          <button class="btn success" id="submitBtn">סיום והגשה (${answered}/${questions.length})</button>`;
        nav.querySelector("#flagBtn").addEventListener("click", () => { state.flags[state.i] = !state.flags[state.i]; renderQ(); });
        nav.querySelector("#submitBtn").addEventListener("click", () => {
          const miss = questions.length - state.answers.filter(Boolean).length;
          if (miss > 0 && !confirm(`נותרו ${miss} שאלות ללא תשובה. להגיש בכל זאת?`)) return;
          finish();
        });
      } else {
        nav.innerHTML = `
          <button class="btn secondary" id="prevBtn" ${state.i === 0 ? "disabled" : ""}>הקודם</button>
          <div class="spacer"></div>
          ${last ? `<button class="btn success" id="finishBtn">סיום וסיכום</button>` : `<button class="btn" id="nextBtn">${state.revealed[state.i] ? "השאלה הבאה" : "דלג"}</button>`}`;
        nav.querySelector("#finishBtn")?.addEventListener("click", finish);
      }
      nav.querySelector("#prevBtn")?.addEventListener("click", () => { if (state.i > 0) { state.i--; renderQ(); } });
      nav.querySelector("#nextBtn")?.addEventListener("click", () => { if (state.i < questions.length - 1) { state.i++; renderQ(); } });
    }

    function renderPalette() {
      const p = view.querySelector("#palette");
      p.innerHTML = questions.map((_, idx) => {
        let cls = "";
        if (state.answers[idx]) cls += " answered";
        if (state.flags[idx]) cls += " flagged";
        if (idx === state.i) cls += " current";
        return `<button class="${cls}" data-idx="${idx}">${idx + 1}</button>`;
      }).join("");
      p.querySelectorAll("button").forEach(b => b.addEventListener("click", () => { state.i = +b.dataset.idx; renderQ(); }));
    }

    function finish() {
      clearActiveTimer();
      const timeSec = (Date.now() - state.startedAt) / 1000;
      const detail = questions.map((q, idx) => ({ q, chosen: state.answers[idx], ok: state.answers[idx] === q.correct }));
      const correct = detail.filter(d => d.ok).length;
      const pct = Math.round(correct / questions.length * 100);

      if (isExam) {
        // record exam-wide stats + accumulate mistakes
        const stats = getStats();
        const topicAgg = {};
        detail.forEach(d => {
          recordAnswer(d.q, d.ok);
          const t = topicAgg[d.q.topic] || (topicAgg[d.q.topic] = { seen: 0, correct: 0 });
          t.seen++; if (d.ok) t.correct++;
        });
        const mistakes = getMistakes();
        detail.forEach(d => { if (!d.ok && d.chosen != null) mistakes.add(d.q.id); });
        saveSet(LS.mistakes, mistakes);
        const fresh = getStats();
        fresh.attempts.unshift({ date: Date.now(), mode: "exam", total: questions.length, correct, pct, timeSec: Math.round(timeSec), pass: pct >= PASS_MARK });
        fresh.attempts = fresh.attempts.slice(0, 50);
        store.set(LS.stats, fresh);
        renderResults({ detail, correct, pct, timeSec, mode, title, topicAgg, timed: !!cfg.timerSec });
      } else {
        renderResults({ detail, correct, pct, timeSec, mode, title });
      }
    }

    shell();
  }

  /* update running stats (answered count + per-topic) — used by practice live + exam finish */
  function recordAnswer(q, ok) {
    const s = getStats();
    s.answered++; if (ok) s.correctTotal++;
    const t = s.topic[q.topic] || (s.topic[q.topic] = { seen: 0, correct: 0 });
    t.seen++; if (ok) t.correct++;
    store.set(LS.stats, s);
  }

  /* ============================================================
     RESULTS
     ============================================================ */
  function renderResults(r) {
    const isExam = r.mode === "exam";
    const pass = r.pct >= PASS_MARK;
    const circ = 2 * Math.PI * 70;
    const offset = circ * (1 - r.pct / 100);

    const topicRows = isExam ? Object.entries(r.topicAgg).sort((a, b) => (a[1].correct / a[1].seen) - (b[1].correct / b[1].seen)).map(([name, t]) => {
      const p = Math.round(t.correct / t.seen * 100);
      const col = p >= 70 ? "var(--success)" : p >= 50 ? "var(--warn)" : "var(--danger)";
      return `<div class="tb-row">
          <span class="label">${esc(name)} ${p < 50 ? '<span class="weak-flag">· מומלץ לחזור</span>' : ""}</span>
          <span class="pct">${t.correct}/${t.seen} · ${p}%</span>
          <span class="tb-bar"><i style="width:${p}%;background:${col}"></i></span>
        </div>`;
    }).join("") : "";

    const reviewHtml = r.detail.map((d, i) => {
      const q = d.q;
      const lines = [];
      if (d.chosen == null) lines.push(`<div class="rev-line"><span class="lab">לא נענתה.</span></div>`);
      else if (d.ok) lines.push(`<div class="rev-line good">✓ ענית: ${esc(d.chosen)}. ${esc(q.options[d.chosen])}</div>`);
      else {
        lines.push(`<div class="rev-line bad">✗ ענית: ${esc(d.chosen)}. ${esc(q.options[d.chosen] || "")}</div>`);
        lines.push(`<div class="rev-line good">✓ נכון: ${esc(q.correct)}. ${esc(q.options[q.correct])}</div>`);
      }
      if (d.ok) lines.push(`<div class="rev-line good">✓ נכון: ${esc(q.correct)}. ${esc(q.options[q.correct])}</div>`);
      if (q.explanation) lines.push(`<div class="rev-line"><span class="lab">הסבר:</span> ${esc(q.explanation)}</div>`);
      return `<div class="rev-item ${d.ok ? "ok" : "no"}">
          <p class="q">${i + 1}. ${esc(q.question)} <span class="topic-chip" style="font-size:.7rem">${esc(q.topic)}</span></p>
          ${lines.join("")}
        </div>`;
    }).join("");

    setView(`
      <section class="screen">
        <h2 class="section-title">${isExam ? "תוצאות המבחן" : "סיכום " + esc(r.title)}</h2>
        <div class="card">
          <div class="score-hero">
            <div class="dial" style="--p:${r.pct}">
              <svg viewBox="0 0 160 160">
                <defs><linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#0ea5e9"/>
                </linearGradient></defs>
                <circle class="track" cx="80" cy="80" r="70"/>
                <circle class="bar" cx="80" cy="80" r="70" stroke-dasharray="${circ}" stroke-dashoffset="${circ}" id="dialBar"/>
              </svg>
              <div class="num"><b id="pctNum">0%</b><span>${r.correct}/${r.detail.length}</span></div>
            </div>
            <div class="verdict">
              ${isExam ? `<span class="tag ${pass ? "pass" : "fail"}">${pass ? "עברת! 🎉" : "לא עברת"}</span>` : `<span class="tag pass">כל הכבוד על התרגול!</span>`}
              <h2>${r.correct} מתוך ${r.detail.length} נכון</h2>
              <p>${isExam ? `ציון עובר הוא ${PASS_MARK}%. ` : ""}${r.timed ? "זמן: " + fmtTime(r.timeSec) + ". " : ""}${isExam ? (pass ? "מצוין — אתה מוכן!" : "עוד קצת תרגול ותגיע לשם.") : ""}</p>
            </div>
          </div>

          <div class="result-stats">
            <div class="rstat ok"><b>${r.correct}</b><span>נכונות</span></div>
            <div class="rstat no"><b>${r.detail.filter(d => !d.ok && d.chosen != null).length}</b><span>שגויות</span></div>
            <div class="rstat"><b>${r.detail.filter(d => d.chosen == null).length}</b><span>ללא מענה</span></div>
            ${r.timed ? `<div class="rstat"><b>${fmtTime(r.timeSec)}</b><span>זמן</span></div>` : ""}
          </div>

          ${isExam && topicRows ? `<h3 style="margin:6px 0 14px">ביצועים לפי נושא</h3><div class="topic-break">${topicRows}</div>` : ""}

          <div class="panel-actions">
            <button class="btn" id="retryBtn">${isExam ? "מבחן חדש" : "שוב"}</button>
            ${isExam && r.detail.some(d => !d.ok) ? `<button class="btn danger" id="reviewWrongBtn">תרגל את הטעויות</button>` : ""}
            <button class="btn secondary" id="menuBtn">תפריט ראשי</button>
          </div>
        </div>

        <h3 style="margin:28px 0 12px">סקירת השאלות</h3>
        <div class="review-list">${reviewHtml}</div>
      </section>
    `);

    // animate dial + count-up
    requestAnimationFrame(() => {
      const bar = view.querySelector("#dialBar"); if (bar) bar.style.strokeDashoffset = offset;
      const num = view.querySelector("#pctNum"); let cur = 0;
      const step = Math.max(1, Math.round(r.pct / 28));
      const iv = setInterval(() => { cur = Math.min(r.pct, cur + step); num.textContent = cur + "%"; if (cur >= r.pct) clearInterval(iv); }, 26);
    });

    view.querySelector("#menuBtn").addEventListener("click", renderMenu);
    view.querySelector("#retryBtn").addEventListener("click", () => {
      if (isExam) { const qs = sampleN(QUESTIONS, TEST_COUNT); runQuiz({ questions: qs, mode: "exam", title: "מבחן מדומה", timerSec: setupTimerOn ? setupMinutes * 60 : 0 }); }
      else startPractice(shuffle(r.detail.map(d => d.q)), r.title);
    });
    view.querySelector("#reviewWrongBtn")?.addEventListener("click", () => {
      const wrong = r.detail.filter(d => !d.ok).map(d => d.q);
      runQuiz({ questions: shuffle(wrong), mode: "practice", title: "תרגול הטעויות", review: true });
    });
  }

  /* ============================================================
     TOPICS
     ============================================================ */
  function renderTopics() {
    const st = getStats();
    setView(`
      <section class="screen">
        <h2 class="section-title">לימוד לפי נושא</h2>
        <p class="section-sub">בחר נושא לתרגול ממוקד. הדיוק מבוסס על כל התרגולים שלך.</p>
        <div class="list-grid">
          ${TOPICS.map((t, i) => {
            const count = QUESTIONS.filter(q => q.topic === t).length;
            const ts = st.topic[t];
            const acc = ts && ts.seen ? Math.round(ts.correct / ts.seen * 100) : null;
            const col = acc == null ? "var(--muted)" : acc >= 70 ? "var(--success)" : acc >= 50 ? "var(--warn)" : "var(--danger)";
            return `<button class="topic-card" data-i="${i}">
                <span class="name">${esc(t)}</span>
                <span class="meta">${count} שאלות</span>
                <span class="acc" style="color:${col}">${acc == null ? "טרם תורגל" : "דיוק " + acc + "%"}</span>
              </button>`;
          }).join("")}
        </div>
        <div class="panel-actions"><button class="btn secondary" id="backBtn">חזרה</button></div>
      </section>
    `);
    view.querySelectorAll(".topic-card").forEach(el => el.addEventListener("click", () => {
      const t = TOPICS[+el.dataset.i];
      startPractice(shuffle(QUESTIONS.filter(q => q.topic === t)), t);
    }));
    view.querySelector("#backBtn").addEventListener("click", renderMenu);
  }

  /* ============================================================
     FLASHCARDS
     ============================================================ */
  function startFlashcards(deck, title) {
    if (!deck.length) { toast("אין כרטיסיות"); return; }
    let i = 0, flipped = false;
    const known = new Set(store.get(LS.flashKnown, []));

    function render() {
      const q = deck[i];
      setView(`
        <section class="screen">
          <div class="runner-top">
            <span class="qcount"><span>${i + 1}</span> <small>/ ${deck.length}</small></span>
            <span class="topic-chip">${esc(q.topic)}</span>
            <div class="spacer"></div>
            <button class="ghost-btn" id="shuffleBtn">ערבוב</button>
            <button class="ghost-btn" id="quitBtn">יציאה</button>
          </div>
          <div class="progress"><i style="width:${(i + 1) / deck.length * 100}%"></i></div>
          <div class="flash-wrap">
            <div class="flashcard ${flipped ? "flipped" : ""}" id="card">
              <div class="flash-inner">
                <div class="flash-face flash-front">
                  <span class="pill">שאלה</span>
                  <div class="q">${esc(q.question)}</div>
                  <div class="tap">לחץ כדי לחשוף את התשובה ↻</div>
                </div>
                <div class="flash-face flash-back">
                  <span class="pill">התשובה הנכונה</span>
                  <div class="ans">${esc(q.correct)}. ${esc(q.options[q.correct])}</div>
                  ${q.explanation ? `<div class="exp">${esc(q.explanation)}</div>` : ""}
                </div>
              </div>
            </div>
            <div class="flash-controls">
              <button class="btn secondary" id="prevBtn" ${i === 0 ? "disabled" : ""}>הקודם</button>
              <button class="btn subtle" id="knownBtn">${known.has(q.id) ? "✓ ידעתי" : "סמן: ידעתי"}</button>
              <button class="btn" id="nextBtn" ${i === deck.length - 1 ? "disabled" : ""}>הבא</button>
            </div>
            <p class="section-sub" style="margin:0">ידעת: ${known.size} מתוך ${deck.length}</p>
          </div>
          <div class="panel-actions"><button class="btn secondary" id="backBtn">תפריט ראשי</button></div>
        </section>
      `);
      const card = view.querySelector("#card");
      card.addEventListener("click", () => { flipped = !flipped; card.classList.toggle("flipped", flipped); });
      view.querySelector("#prevBtn").addEventListener("click", () => { if (i > 0) { i--; flipped = false; render(); } });
      view.querySelector("#nextBtn").addEventListener("click", () => { if (i < deck.length - 1) { i++; flipped = false; render(); } });
      view.querySelector("#knownBtn").addEventListener("click", () => { if (known.has(q.id)) known.delete(q.id); else known.add(q.id); saveSet(LS.flashKnown, known); render(); });
      view.querySelector("#shuffleBtn").addEventListener("click", () => { deck = shuffle(deck); i = 0; flipped = false; render(); });
      view.querySelector("#quitBtn").addEventListener("click", renderMenu);
      view.querySelector("#backBtn").addEventListener("click", renderMenu);
    }
    render();
  }

  /* ============================================================
     BOOKMARKS
     ============================================================ */
  function renderBookmarks() {
    const ids = [...getBookmarks()];
    const qs = ids.map(id => byId.get(id)).filter(Boolean);
    if (!qs.length) { renderEmpty("אין שאלות מסומנות", "סמן שאלות בכוכב ⭐ בזמן תרגול או מבחן, והן יופיעו כאן לחזרה מהירה.", renderMenu); return; }
    setView(`
      <section class="screen">
        <h2 class="section-title">שאלות מסומנות</h2>
        <p class="section-sub">${qs.length} שאלות שמורות.</p>
        <div class="panel-actions" style="margin-top:0;margin-bottom:18px">
          <button class="btn" id="practiceBtn">${ICON.prac} תרגל את כולן</button>
          <button class="btn flash" id="flashBtn">כרטיסיות</button>
          <button class="btn secondary" id="backBtn">חזרה</button>
        </div>
        <div id="list">
          ${qs.map(q => `<div class="bk-item" data-id="${q.id}">
              <span class="star">${ICON.starFull}</span>
              <span class="q">${esc(q.question)}<br><small style="color:var(--muted)">${esc(q.topic)} · תשובה: ${esc(q.correct)}. ${esc(q.options[q.correct])}</small></span>
              <button class="icon-btn on" title="הסר" data-rm="${q.id}">✕</button>
            </div>`).join("")}
        </div>
      </section>
    `);
    view.querySelector("#practiceBtn").addEventListener("click", () => startPractice(shuffle(qs), "שאלות מסומנות"));
    view.querySelector("#flashBtn").addEventListener("click", () => startFlashcards(shuffle(qs), "מסומנות"));
    view.querySelector("#backBtn").addEventListener("click", renderMenu);
    view.querySelectorAll("[data-rm]").forEach(b => b.addEventListener("click", () => {
      const bm = getBookmarks(); bm.delete(+b.dataset.rm); saveSet(LS.bookmarks, bm); renderBookmarks();
    }));
  }

  /* ============================================================
     STATS
     ============================================================ */
  function renderStats() {
    const st = getStats();
    const accuracy = st.answered ? Math.round(st.correctTotal / st.answered * 100) : 0;
    const exams = st.attempts.filter(a => a.mode === "exam");
    const best = exams.reduce((m, a) => Math.max(m, a.pct), 0);
    const avg = exams.length ? Math.round(exams.reduce((s, a) => s + a.pct, 0) / exams.length) : 0;

    setView(`
      <section class="screen">
        <h2 class="section-title">התקדמות וסטטיסטיקה</h2>
        <p class="section-sub">המידע נשמר במכשיר הזה בלבד (בדפדפן).</p>
        <div class="stat-cards">
          <div class="stat-card"><b>${st.answered}</b><span>תשובות בסך הכול</span></div>
          <div class="stat-card"><b>${accuracy}%</b><span>דיוק כולל</span></div>
          <div class="stat-card"><b>${exams.length}</b><span>מבחנים שביצעת</span></div>
          <div class="stat-card"><b>${best ? best + "%" : "—"}</b><span>הציון הטוב ביותר</span></div>
          <div class="stat-card"><b>${avg ? avg + "%" : "—"}</b><span>ממוצע מבחנים</span></div>
          <div class="stat-card"><b>${getMistakes().size}</b><span>טעויות לחזרה</span></div>
        </div>

        <h3 style="margin:6px 0 12px">היסטוריית מבחנים</h3>
        ${exams.length ? `<div class="history">${exams.map(a => `
          <div class="hist-row">
            <span class="dot ${a.pass ? "pass" : "fail"}"></span>
            <span>${fmtDate(a.date)}</span>
            <span>${a.timeSec ? fmtTime(a.timeSec) : "—"}</span>
            <span class="sc" style="color:${a.pass ? "var(--success)" : "var(--danger)"}">${a.correct}/${a.total} · ${a.pct}%</span>
          </div>`).join("")}</div>` : `<p class="section-sub">עדיין לא ביצעת מבחן מלא.</p>`}

        <div class="panel-actions">
          <button class="btn secondary" id="backBtn">חזרה</button>
          <button class="btn subtle" id="resetBtn">איפוס נתונים</button>
        </div>
      </section>
    `);
    view.querySelector("#backBtn").addEventListener("click", renderMenu);
    view.querySelector("#resetBtn").addEventListener("click", () => {
      if (confirm("לאפס את כל ההתקדמות, הטעויות והמסומנים? לא ניתן לבטל.")) {
        [LS.mistakes, LS.bookmarks, LS.stats, LS.flashKnown].forEach(k => localStorage.removeItem(k));
        toast("הנתונים אופסו"); renderStats();
      }
    });
  }

  /* ---------- shared empty state ---------- */
  function renderEmpty(title, body, back) {
    setView(`<section class="screen"><div class="card"><div class="empty">
      <div class="big">📭</div><h2 class="section-title" style="font-size:1.4rem">${esc(title)}</h2>
      <p class="section-sub">${esc(body)}</p>
      <button class="btn" id="backBtn">חזרה לתפריט</button>
    </div></div></section>`);
    view.querySelector("#backBtn").addEventListener("click", back);
  }

  /* ---------- boot ---------- */
  function boot() {
    if (!QUESTIONS.length) {
      setView(`<section class="screen"><div class="card empty">
        <div class="big">⚠️</div>
        <h2 class="section-title" style="font-size:1.4rem">לא נטענו שאלות</h2>
        <p class="section-sub">ודא שהקובץ <code>questions.js</code> נמצא לצד <code>index.html</code>.</p>
      </div></section>`);
      return;
    }
    document.getElementById("homeBtn").addEventListener("click", renderMenu);
    document.getElementById("brandHome").addEventListener("click", renderMenu);
    renderMenu();
  }
  document.addEventListener("DOMContentLoaded", boot);
})();

</script>
</body>
</html>
